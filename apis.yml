name: Industrial Microbes
description: Industrial Microbes (iMicrobes) is a synthetic-biology company in Alameda,
  California that engineers microorganisms to convert renewable, low-carbon feedstocks
  such as ethanol and methane into commercial-grade industrial chemicals and bio-based
  materials. Founded in 2014 (Y Combinator W15) by Liz Clarke, Derek Greenfield, and
  Noah Helman, the company has produced 100% bio-based acrylic acid and targets net-zero
  or negative-emission building-block chemicals for coatings, paints, carbon-fiber
  precursors, biopolymers, and biodegradable plastics. This is a company profile in
  the API Evangelist network; Industrial Microbes publishes no public developer API,
  OpenAPI definition, SDKs, or developer portal, so the enrichment pipeline captured
  only verified company identity and website link properties.
